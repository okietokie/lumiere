services:
  - type: web
    name: lumiere-backend
    runtime: python
    rootDir: lumiere-backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
