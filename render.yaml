services:
  - type: web
    name: lumiere-backend
    runtime: python
    rootDir: lumiere-backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: WEB_CONCURRENCY
        value: 2
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: sh -c 'python -m uvicorn app.main:app --host 0.0.0.0 --port "$PORT" --workers "${WEB_CONCURRENCY:-2}"'
